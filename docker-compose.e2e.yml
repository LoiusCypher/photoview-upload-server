services:
  app:
    build:
      context: .
      tags:
        - "loiuscypher/photoview-upload-server:testing"
    ports:
      - "127.0.0.1::8080"
    volumes:
      - jpgroot:/jpgroot
    command: -picture_root=/jpgroot -addr=:8080
  test:
    image: golang:1.26
    environment:
      - TEST_WITH_REAL_FS=/jpgroot
      - TEST_TARGET_ADDR=app:8080
    volumes:
      - .:/app
      - jpgroot:/jpgroot
      - sqlroot:/sqlroot
    working_dir: /app
    command: go test -v -run TestServer ./...
    depends_on:
      - app
volumes:
  jpgroot:
  sqlroot:

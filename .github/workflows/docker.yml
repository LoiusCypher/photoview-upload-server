name: Docker Image CI

on:
  push:
    branches: [ "master" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "master" ]

env:
  # DOCKER_REGISTRY: ${{ ( github.repository != 'LoiusCypher/photoview-upload-server' || github.ref != 'refs/heads/master' ) && 'ghcr.io/' || '' }}
  DOCKER_REGISTRY: ${{ '' }}
  DOCKER_USERNAME: loiusc
  DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKER_IMAGE: ${{ 'loiusc/photoview-upload-server' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag loiuscypher/photoview-upload-server:$(date +%s)

  push:
    runs-on: ubuntu-latest
    steps:
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.DOCKER_REGISTRY }}${{ env.DOCKER_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
    - uses: actions/checkout@v7
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
#    - name: Test
#      run: |
#        docker compose -f docker-compose.e2e.yml run --rm test
#        docker compose -f docker-compose.e2e.yml down --rmi local --volumes
    - name: Build and Publish
      uses: docker/build-push-action@v7
      with:
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
